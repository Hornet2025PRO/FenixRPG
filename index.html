<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FenixRPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1",
    "peerjs": "https://esm.sh/peerjs@1.5.4?bundle"
  }
}
</script>
<style>
  body {
    font-family: 'Merriweather', serif;
    background-image: radial-gradient(ellipse at center, #fdf4d8 0%, #f3e9d2 100%);
    background-attachment: fixed;
    min-height: 100vh;
  }

  .font-display {
    font-family: 'Cinzel', serif;
  }

  .text-shadow {
    text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
  }

  .parchment {
    background-color: #fdf9f3;
    border: 1px solid #dcd3b8;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1), 0 2px 5px rgba(0, 0, 0, 0.05);
  }

  hr.decorative {
    border: 0;
    height: 1px;
    background-image: linear-gradient(to right, rgba(120, 81, 62, 0), rgba(120, 81, 62, 0.75), rgba(120, 81, 62, 0));
    margin: 1rem auto;
  }

  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: #f3e9d2;
  }
  ::-webkit-scrollbar-thumb {
    background-color: #c7bca1;
    border-radius: 4px;
    border: 2px solid #f3e9d2;
  }
  ::-webkit-scrollbar-thumb:hover {
    background-color: #ab9f82;
  }

  @keyframes pulse-glow {
    0%, 100% {
      box-shadow: 0 0 8px 2px rgba(194, 128, 64, 0.4), inset 0 0 4px 1px rgba(194, 128, 64, 0.2);
      border-color: rgba(194, 128, 64, 0.7);
    }
    50% {
      box-shadow: 0 0 16px 5px rgba(194, 128, 64, 0.7), inset 0 0 8px 2px rgba(194, 128, 64, 0.3);
      border-color: rgba(194, 128, 64, 1);
    }
  }
  .animate-pulse-glow {
    animation: pulse-glow 2.5s infinite ease-in-out;
  }

  @keyframes damage-shake-flash {
    0% { transform: translateX(0); outline: 2px solid transparent; }
    10%, 30%, 50% { transform: translateX(-4px); }
    20%, 40%, 60% { transform: translateX(4px); }
    70% { transform: translateX(0); }
    25%, 50% { outline: 3px solid rgba(220, 38, 38, 0.8); }
    100% { outline: 2px solid transparent; }
  }
  .animate-damage {
    animation: damage-shake-flash 0.6s cubic-bezier(.36,.07,.19,.97) both;
  }

</style>
</head>
  <body class="text-stone-800">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
